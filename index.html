<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e7" />
  <title>蝦・鮮蚵・櫛瓜燉飯｜ChatGPT Cooks</title>
  <style>
    :root{--bg:#f7f1e7;--card:#fffdf8;--ink:#24211d;--muted:#716a61;--line:#ded5c7;--accent:#b94d35;--green:#486a52;--greenSoft:#e7efe8;--orange:#9a5a1f;--orangeSoft:#fff0dc;--redSoft:#f8e2dc;--shadow:0 10px 28px rgba(51,40,28,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.62;font-size:17px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    button{font:inherit;color:inherit}.wrap{width:min(760px,calc(100% - 28px));margin:auto}header{padding:calc(18px + env(safe-area-inset-top)) 0 10px}.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.1em;color:var(--accent)}h1{font-size:clamp(1.8rem,8vw,3.1rem);line-height:1.08;margin:7px 0 8px}.subtitle{margin:0;color:var(--muted);font-size:.96rem}.chips{display:flex;gap:7px;overflow:auto;padding:11px 0 2px}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff8;border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:800}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(247,241,231,.94);backdrop-filter:blur(14px);border-block:1px solid rgba(222,213,199,.85)}.topbar-inner{display:flex;align-items:center;gap:8px;padding:9px 0}.seg{display:flex;background:#e8dfd2;border-radius:12px;padding:3px}.seg button{min-height:42px;border:0;background:transparent;border-radius:9px;padding:5px 12px;font-weight:850;color:var(--muted)}.seg button.active{background:white;color:var(--ink);box-shadow:0 2px 8px #0001}.wake{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:7px 11px;font-weight:800;margin-left:auto}.wake.on{background:var(--greenSoft);color:#294c35}.progress{height:4px;background:#ded5c7}.progress>div{height:100%;background:var(--green);transition:width .25s}
    main{padding:16px 0 26px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.quick{padding:14px 15px;margin-bottom:14px;background:#fff3cd;border-color:#ead795;box-shadow:none;font-size:.9rem}.cook-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 10px}.cook-head h2{margin:0;font-size:1.08rem}.count{font-size:.82rem;color:var(--muted);font-weight:850}.step-card{padding:20px 18px 18px;min-height:430px;display:flex;flex-direction:column}.meta{display:flex;gap:8px;align-items:center}.no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:950}.pill{background:#efe7da;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:850}.step-card h3{font-size:1.5rem;line-height:1.22;margin:10px 0 10px}.step-card p{margin:7px 0}.step-card ul,.step-card ol{margin:8px 0;padding-left:1.35rem}.step-card li{margin:6px 0}.cue,.heat,.warn,.safe{border-left:4px solid;border-radius:10px;padding:10px 12px;margin:11px 0;font-size:.94rem}.heat{border-color:var(--orange);background:var(--orangeSoft)}.cue{border-color:var(--green);background:var(--greenSoft)}.warn{border-color:var(--accent);background:var(--redSoft)}.safe{border-color:#b48b24;background:#fff3cd}.label{font-size:.78rem;font-weight:950;letter-spacing:.04em;margin-bottom:3px}.actions{margin-top:auto;padding-top:14px;display:flex;gap:8px;flex-wrap:wrap}.action{min-height:48px;border-radius:12px;border:1px solid var(--line);background:white;padding:9px 13px;font-weight:850}.action.running{background:#fff3cd}.readout{font-variant-numeric:tabular-nums;font-weight:950}
    details{margin-top:14px}summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-weight:900}summary::-webkit-details-marker{display:none}summary::after{content:"＋";font-size:1.35rem;color:var(--muted)}details[open] summary::after{content:"−"}.details-body{border-top:1px solid var(--line);padding:10px 15px 16px}.ingredient{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line)}.qty{text-align:right;font-weight:900}.all{display:grid;gap:7px}.all button{border:0;background:#f3ece1;border-radius:12px;text-align:left;padding:11px 12px;min-height:48px;display:flex;gap:9px;align-items:center}.all button.current{background:var(--greenSoft);box-shadow:inset 0 0 0 2px #b7cfbd}.all button.done{opacity:.55}.all .idx{width:27px;height:27px;display:grid;place-items:center;background:white;border-radius:50%;font-size:.78rem;font-weight:900;flex:0 0 auto}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.bottom-inner{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:1fr 1.7fr;gap:8px}.nav{min-height:56px;border-radius:14px;border:1px solid var(--line);font-weight:950;background:white}.nav.next{background:var(--accent);border-color:var(--accent);color:white}.nav:disabled{opacity:.4}
    @media(min-width:720px){body{font-size:18px}.step-card{padding:25px 26px;min-height:440px}}
  </style>
</head>
<body>
<header class="wrap"><div class="eyebrow">CHATGPT COOKS · 手機料理模式</div><h1>蝦・鮮蚵・櫛瓜<br>檸檬奶油燉飯</h1><p class="subtitle">三好米星川壽司米＋新鮮蒜頭。每一步都寫火力、下鍋時機與可觀察的完成訊號。</p><div class="chips"><span class="chip">約 40–50 分鐘</span><span class="chip">目前主鍋：不鏽鋼</span><span class="chip">星川壽司米</span><span class="chip">不放起司</span></div></header>
<div class="topbar"><div class="wrap topbar-inner"><div class="seg" id="servings"><button class="active" data-serving="2">2 人</button><button data-serving="4">4 人</button></div><button class="wake" id="wakeBtn" type="button">保持螢幕亮</button></div><div class="progress"><div id="progressBar"></div></div></div>
<main class="wrap">
  <div class="card quick"><strong>現在用不鏽鋼鍋：</strong>燉飯階段維持中小火～中火、小滾即可。不要等鍋底乾到焦才補湯。</div>
  <div class="cook-head"><h2>現在做這一步</h2><div class="count" id="stepCount"></div></div>
  <section class="card step-card" id="stepCard"></section>
  <details class="card"><summary>完整食材</summary><div class="details-body" id="ingredientList"></div></details>
  <details class="card" id="allStepsDetails"><summary>全部步驟</summary><div class="details-body all" id="allSteps"></div></details>
  <details class="card"><summary>火候速查</summary><div class="details-body"><p><strong>中小火：</strong>洋蔥、蒜、燉飯吸湯。聲音偏柔和。</p><p><strong>中火：</strong>炒米、維持燉飯小滾。</p><p><strong>中大火：</strong>只短暫煎蝦／櫛瓜上色；冒煙就太熱。</p><p><strong>不鏽鋼鍋：</strong>燉飯不要煮到鍋底乾透；液體快收乾前就補下一輪。</p></div></details>
</main>
<nav class="bottom"><div class="bottom-inner"><button class="nav" id="prevBtn">← 上一步</button><button class="nav next" id="nextBtn">完成這步 →</button></div></nav>
<script>
const ingredients=[["三好米 星川壽司米","180 g","360 g"],["帶頭草蝦","1 盒","2 盒"],["鮮蚵","120–150 g","220–300 g"],["櫛瓜","1 根","1.5–2 根"],["洋蔥","1/2 顆","1 顆"],["新鮮蒜頭","1 大瓣／2 小瓣","2 大瓣／3–4 小瓣"],["史雲生極鮮清雞湯","400 ml","800 ml"],["水（熬蝦湯）","250 ml","400 ml"],["額外熱水（備用）","150–200 ml","250–300 ml"],["無鹽奶油","20 g","35–40 g"],["食用油／橄欖油","約 1 大匙","約 1.5–2 大匙"],["1:4 稀釋檸檬汁","先 10–20 ml","先 20–40 ml"],["乾白酒（可省）","50 ml","80–100 ml"],["黑胡椒、鹽","最後調味","最後調味"]];
let servings=Number(localStorage.getItem('cook-servings'))||2,current=Math.min(Number(localStorage.getItem('cook-step'))||0,17),timerId=null,wakeLock=null;
const d={stock:()=>servings===2?'400 ml 雞湯＋250 ml 水':'800 ml 雞湯＋400 ml 水',veg:()=>servings===2?'櫛瓜 1 根＋洋蔥 1/2 顆＋蒜 1 大瓣／2 小瓣':'櫛瓜 1.5–2 根＋洋蔥 1 顆＋蒜 2 大瓣／3–4 小瓣',rice:()=>servings===2?'180 g':'360 g',wine:()=>servings===2?'50 ml':'80–100 ml',first:()=>servings===2?'約 120 ml':'約 180 ml',next:()=>servings===2?'80–100 ml':'120–150 ml',butter:()=>servings===2?'20 g':'35–40 g',lemon:()=>servings===2?'先 10–20 ml':'先 20–40 ml'};
const steps=[
{t:'全部備料先到位',time:'5–8 分鐘',body:`<p><strong>星川壽司米直接秤好，不洗、不泡。</strong>奶油繼續冰著。另燒一壺熱水備用。</p><p>準備小鍋做高湯、主鍋做燉飯。</p>`},
{t:'處理草蝦',time:'5 分鐘',body:`<p>拔蝦頭、剝殼，<strong>蝦頭蝦殼全部留下</strong>。蝦肉開背去腸泥、擦乾、冷藏。</p>`,cue:'蝦肉越乾，等等越容易煎出香味。'},
{t:'做快速蝦殼雞高湯',time:'約 12 分鐘',timer:600,body:`<p>小鍋先放 <strong>1 小匙油</strong>，再開中火。油變流動後丟一片蝦殼測試；立刻滋滋就把全部蝦頭蝦殼下鍋。</p><p>炒 2–3 分鐘、稍壓蝦頭，再加入 <strong><span data-dyn="stock"></span></strong>。煮滾轉小火，微滾 8–10 分鐘，過濾並保持熱。</p>`,warn:'這一步完全沒有米、洋蔥或蒜。'},
{t:'處理鮮蚵',time:'2–3 分鐘',body:`<p>倒掉盒中液體，用冷水快速輕柔沖洗，挑掉碎殼後充分瀝乾，再放回冰箱。</p>`,warn:'不要搓洗，也不要泡水。'},
{t:'切櫛瓜、洋蔥、蒜',time:'5 分鐘',body:`<p>櫛瓜不用去皮，切 <strong>1–1.5 cm 丁</strong>；洋蔥細丁；蒜切末。</p><p><strong><span data-dyn="veg"></span></strong></p>`},
{t:'先煎櫛瓜',time:'3–4 分鐘',timer:180,body:`<p>冷鍋先放約 2 小匙油，開中火。油流動順後先放 1 塊櫛瓜測試；立刻滋滋再把其餘鋪平。</p><p>外面微金黃、裡面還有硬度就盛出。</p>`,warn:'先不要加鹽，避免大量出水。'},
{t:'把蝦煎到剛好全熟',time:'約 2–3 分鐘',timer:120,body:`<p>鍋太乾才補 1 小匙油。中火到中大火，蝦一碰鍋有滋滋聲才下。</p><p>每面約 45–75 秒；蝦肉完全不透明、剛有彈性就盛出。</p>`,warn:'不要煎到緊縮乾硬。'},
{t:'炒洋蔥，再下新鮮蒜',time:'3–4 分鐘',timer:180,body:`<p>降到<strong>中小火</strong>。洋蔥溫和滋滋地炒到柔軟、半透明。</p><p>再下蒜末 20–30 秒，一聞到蒜香就進下一步。</p>`,warn:'蒜不要炒成咖啡色。'},
{t:'生米下鍋炒',time:'2 分鐘',timer:120,body:`<p>加入 <strong><span data-dyn="rice"></span></strong> 星川壽司米，轉中火翻炒約 2 分鐘。米表面均勻油亮即可。</p>`},
{t:'有白酒就加，沒有跳過',time:'1–2 分鐘',timer:90,body:`<p>若有乾白酒，加入 <strong><span data-dyn="wine"></span></strong>，中火煮到酒精味散去、鍋底不再有一灘液體。</p>`,warn:'不要用稀釋檸檬汁代替白酒。'},
{t:'開始分次加熱高湯',time:'約 11–14 分鐘',body:`<ol><li><strong>現在開始計時。</strong>第一輪倒入 <strong><span data-dyn="first"></span></strong> 熱高湯。</li><li>保持<strong>中小火～中火、小滾</strong>：表面持續有小泡泡，但不是整鍋猛烈翻滾。</li><li>倒完先把整鍋輕拌均勻；之後約每 20–30 秒輕拌 2–3 下，不用一直攪。</li><li>要不要補下一輪，看鍋底：用鍋鏟從中央劃一道。<strong>能看到鍋底約 1 秒，米和稠汁才慢慢流回來</strong>，就補下一輪 <strong><span data-dyn="next"></span></strong>。</li><li>如果一劃就立刻被水淹回來＝還太濕，先別加。若劃開後鍋底一直露著、米開始黏成一坨＝太乾，立刻補湯。</li></ol>`,heat:'正確狀態像偏稀的粥：米一直被少量稠汁包住，有小泡泡、能流動，但不是泡在一大池湯裡。',cue:'從第一輪高湯倒下去的那一刻開始算；第 11–12 分鐘開始試米。每輪不是固定幾分鐘，完全看「鍋底露約 1 秒」這個訊號。',warn:'米還硬但高湯快沒了，就用旁邊的熱水繼續補；不要讓鍋底乾到焦。'},
{t:'判斷米還差 3–4 分鐘',time:'靠試吃',body:`<p>第 11–12 分鐘起，每 1–2 分鐘吃一顆。</p><p>當外層已軟、中心仍明顯偏硬，但再煮 3–4 分鐘應會剛好，就進下一步。</p>`,cue:'不要追固定分鐘；試吃比計時重要。'},
{t:'鮮蚵下鍋',time:'至少約 3 分鐘',timer:180,body:`<p>把瀝乾鮮蚵輕輕拌入，保持小滾。等小泡泡重新出現後再開始算時間。</p><p>鮮蚵要煮到<strong>乳白不透明、邊緣微捲</strong>。</p>`,safe:'仍偏透明就繼續煮，不要只看計時器。'},
{t:'櫛瓜回鍋',time:'約 1 分鐘',timer:60,body:`<p>米接近完成、鮮蚵幾乎熟時，把煎好的櫛瓜拌回去。</p>`},
{t:'熟蝦最後回鍋',time:'30–60 秒',timer:45,body:`<p>把先前煎熟的蝦放回去，拌勻，加熱 30–60 秒。</p>`,warn:'不要再煮 2–3 分鐘。'},
{t:'把流動度調對',time:'30–60 秒',body:`<p>晃鍋時整鍋應有波浪感，而且比最後想吃的狀態稍微稀一點。</p><ul><li>太乾：補 30–50 ml 熱高湯／熱水。</li><li>太水：小滾 30–60 秒。</li></ul>`},
{t:'關火，拌冷奶油',time:'30–45 秒',timer:40,body:`<p><strong>先關火。</strong>加入無鹽奶油 <strong><span data-dyn="butter"></span></strong>，快速但輕柔拌 30–45 秒。</p>`,cue:'拌好後應更滑、更有光澤。'},
{t:'檸檬、黑胡椒、最後才決定鹽',time:'1 分鐘',body:`<p>先加 1:4 稀釋檸檬汁 <strong><span data-dyn="lemon"></span></strong>，拌勻試味道。</p><p>磨黑胡椒，再吃一口；真的不夠鹹才補鹽。</p>`,cue:'完成後立刻盛盤；燉飯應能慢慢攤開。'}
];
const stepCard=document.getElementById('stepCard'),stepCount=document.getElementById('stepCount'),progressBar=document.getElementById('progressBar'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),ingredientList=document.getElementById('ingredientList'),allSteps=document.getElementById('allSteps');
function dyn(root=document){root.querySelectorAll('[data-dyn]').forEach(el=>{const fn=d[el.dataset.dyn];if(fn)el.textContent=fn()})}
function save(){localStorage.setItem('cook-step',current);localStorage.setItem('cook-servings',servings)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function renderIngredients(){ingredientList.innerHTML=ingredients.map(x=>`<div class="ingredient"><span>${x[0]}</span><span class="qty">${servings===2?x[1]:x[2]}</span></div>`).join('')}
function renderAll(){allSteps.innerHTML=steps.map((s,i)=>`<button class="${i===current?'current':''} ${i<current?'done':''}" data-jump="${i}"><span class="idx">${i+1}</span><strong>${s.t}</strong></button>`).join('');allSteps.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{current=+b.dataset.jump;save();render();document.getElementById('allStepsDetails').open=false;scrollTo({top:0,behavior:'smooth'})})}
function fmt(sec){let m=Math.floor(sec/60),s=sec%60;return s?`${m}:${String(s).padStart(2,'0')}`:`${m} 分鐘`}
function render(){stopTimer();const s=steps[current];stepCard.innerHTML=`<div class="meta"><span class="no">${current+1}</span><span class="pill">${s.time}</span></div><h3>${s.t}</h3><div>${s.body}</div>${s.heat?`<div class="heat"><div class="label">火力／下鍋時機</div>${s.heat}</div>`:''}${s.cue?`<div class="cue"><div class="label">看到這樣就對了</div>${s.cue}</div>`:''}${s.warn?`<div class="warn"><div class="label">注意</div>${s.warn}</div>`:''}${s.safe?`<div class="safe"><div class="label">熟度</div>${s.safe}</div>`:''}<div class="actions">${s.timer?`<button class="action" id="timerBtn">開始 ${fmt(s.timer)} 計時</button><span class="action readout" id="timerOut" hidden></span>`:''}</div>`;dyn(stepCard);stepCount.textContent=`${current+1} / ${steps.length}`;progressBar.style.width=`${current/(steps.length-1)*100}%`;prevBtn.disabled=current===0;nextBtn.textContent=current===steps.length-1?'完成料理':'完成這步 →';renderAll();if(s.timer)document.getElementById('timerBtn').onclick=()=>startTimer(s.timer)}
function startTimer(sec){stopTimer();let remain=sec,btn=document.getElementById('timerBtn'),out=document.getElementById('timerOut');btn.classList.add('running');btn.textContent='重新計時';out.hidden=false;const tick=()=>{let m=Math.floor(remain/60),s=remain%60;out.textContent=`${m}:${String(s).padStart(2,'0')}`;if(remain<=0){clearInterval(timerId);timerId=null;out.textContent='時間到';if(navigator.vibrate)navigator.vibrate([180,100,180]);return}remain--};tick();timerId=setInterval(tick,1000)}
prevBtn.onclick=()=>{if(current>0){current--;save();render();scrollTo({top:0,behavior:'smooth'})}};
nextBtn.onclick=()=>{if(current<steps.length-1){current++;save();render();scrollTo({top:0,behavior:'smooth'})}else{nextBtn.disabled=true;stepCard.innerHTML='<h3>完成，可以盛盤了</h3><p>米有咬感、鮮蚵不透明、蝦仍有彈性，燉飯能慢慢攤開，就是正確狀態。</p>'}};
document.querySelectorAll('#servings button').forEach(b=>{b.classList.toggle('active',+b.dataset.serving===servings);b.onclick=()=>{servings=+b.dataset.serving;document.querySelectorAll('#servings button').forEach(x=>x.classList.toggle('active',x===b));save();renderIngredients();render()}});
const wakeBtn=document.getElementById('wakeBtn');async function requestWake(){if(!('wakeLock'in navigator)){wakeBtn.textContent='瀏覽器不支援常亮';wakeBtn.disabled=true;return}try{wakeLock=await navigator.wakeLock.request('screen');wakeBtn.textContent='螢幕保持亮 ✓';wakeBtn.classList.add('on');wakeLock.addEventListener('release',()=>{wakeBtn.textContent='保持螢幕亮';wakeBtn.classList.remove('on')})}catch(e){wakeBtn.textContent='無法保持常亮'}}
wakeBtn.onclick=async()=>{if(wakeLock&&!wakeLock.released){await wakeLock.release();wakeLock=null}else await requestWake()};
renderIngredients();render();
</script></body></html>
